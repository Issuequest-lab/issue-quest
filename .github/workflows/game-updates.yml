name: Update game patch archive
on:
  schedule:
    - cron: '43 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_games.py
      - game-catalog.json
      - test_games.py
      - .github/workflows/game-updates.yml
permissions:
  contents: write
concurrency:
  group: daily-issues
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3
      - run: python test_games.py
      - run: python update_games.py
      - name: Preserve game patch snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-updates game-updates-index.json game-updates-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive official game updates (JST)'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
