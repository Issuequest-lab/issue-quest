name: Update daily issues
on:
  schedule:
    - cron: '17 18 * * *'
    - cron: '47 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_daily.py
      - .github/workflows/daily-issues.yml
permissions:
  contents: write
concurrency:
  group: daily-issues
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check feed validation
        run: python3 scripts/test_daily.py
      - name: Fetch current Japanese trends
        run: python3 scripts/update_daily.py
      - name: Save data for the public app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily-issues.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily trends (JST)'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
